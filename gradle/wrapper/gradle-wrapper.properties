# Pinned Gradle distribution: the SINGLE source of truth for CI.
# The wrapper JAR is deliberately not committed; CI reads the version from
# THIS file and regenerates the wrapper from it.
# Gradle 8.13: AGP 8.13.2 requires Gradle >= 8.13; Kotlin Gradle Plugin
# 2.4.21 fully supports Gradle 7.6.3-9.7.0.
distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
distributionUrl=https\://services.gradle.org/distributions/gradle-8.13-bin.zip
networkTimeout=10000
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
