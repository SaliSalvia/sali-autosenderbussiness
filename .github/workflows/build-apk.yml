name: Build SaliBussiness APK

# pull_request is REQUIRED: Dependabot PRs used to merge without any build at all,
# which is how an AGP 9.5 / Gradle 8.9 mismatch reached main unnoticed.
on:
  workflow_dispatch:
  push:
    branches: [ main, 'arena/**' ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: build-sali-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test, lint and build APK / AAB
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Versioned releases are immutable: a vX.Y.Z tag must match Gradle's
      # versionName before any release build is attempted.
      - name: Validate version tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          set -euo pipefail
          app_version="$(grep -m1 -E '^[[:space:]]*versionName[[:space:]]*=' app/build.gradle.kts | cut -d '"' -f 2)"
          tag_version="${GITHUB_REF_NAME#v}"

          if [[ -z "$app_version" || "$tag_version" != "$app_version" ]]; then
            echo "::error title=Release tag/version mismatch::Tag $GITHUB_REF_NAME must match app versionName (found: $app_version)"
            exit 1
          fi

          echo "Validated release tag $GITHUB_REF_NAME for app version $app_version."

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Read Gradle version from wrapper properties
        id: wrapper
        shell: bash
        run: |
          set -euo pipefail

          url="$(sed -n 's/^distributionUrl=//p' gradle/wrapper/gradle-wrapper.properties)"
          version="$(basename "$url" | sed -E 's/^gradle-([0-9.]+)-bin\.zip$/\1/')"

          if [[ -z "$version" ]]; then
            echo "Could not read Gradle version from gradle-wrapper.properties"
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Using Gradle $version from gradle-wrapper.properties"

      - name: Install Android SDK platform 36 and build-tools 36
        shell: bash
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SM" ]; then SM="$(find "$SDK" -name sdkmanager -type f | head -1)"; fi
          echo "Using sdkmanager: $SM"
          yes | "$SM" --licenses > /dev/null 2>&1 || true
          "$SM" "platforms;android-36" "build-tools;36.0.0" > /dev/null
          "$SM" --list_installed | grep -E 'platforms;android-36|build-tools;36' || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: ${{ steps.wrapper.outputs.version }}

      # The wrapper JAR is a binary and is intentionally not committed. It is
      # regenerated in CI from the version recorded in gradle-wrapper.properties.
      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version "${{ steps.wrapper.outputs.version }}" --distribution-type bin

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Unit tests and Android lint
        run: |
          set -o pipefail
          ./gradlew --no-daemon clean testDebugUnitTest lintDebug lintRelease jacocoTestReport --stacktrace 2>&1 | tee checks.log

      - name: Upload unit-test and coverage reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-coverage
          path: |
            app/build/reports/tests/testDebugUnitTest/
            app/build/reports/jacoco/jacocoTestReport/
            app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
          retention-days: 14

      - name: Build debug APK (installable, no secrets required)
        run: |
          set -o pipefail
          ./gradlew --no-daemon assembleDebug --stacktrace 2>&1 | tee build.log

      - name: Validate release signing configuration
        id: signing
        if: github.event_name != 'pull_request'
        env:
          SALI_KEYSTORE_BASE64: ${{ secrets.SALI_KEYSTORE_BASE64 }}
          SALI_KEYSTORE_PASSWORD: ${{ secrets.SALI_KEYSTORE_PASSWORD }}
          SALI_KEY_ALIAS: ${{ secrets.SALI_KEY_ALIAS }}
          SALI_KEY_PASSWORD: ${{ secrets.SALI_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "$SALI_KEYSTORE_BASE64" && -n "$SALI_KEYSTORE_PASSWORD" && -n "$SALI_KEY_ALIAS" && -n "$SALI_KEY_PASSWORD" ]]; then
            echo "production_signed=true" >> "$GITHUB_OUTPUT"
            echo "All production signing inputs are configured."
          elif [[ -z "$SALI_KEYSTORE_BASE64" && -z "$SALI_KEYSTORE_PASSWORD" && -z "$SALI_KEY_ALIAS" && -z "$SALI_KEY_PASSWORD" ]]; then
            if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
              echo "::error title=Release signing secrets missing::Versioned releases require all four SALI_KEYSTORE_* secrets."
              exit 1
            fi
            echo "production_signed=false" >> "$GITHUB_OUTPUT"
            echo "No production signing inputs: only unsigned CI validation artifacts will be produced."
          else
            echo "Partial signing configuration detected. Configure all four SALI_KEYSTORE_* secrets or remove them all."
            exit 1
          fi

      - name: Build signed release APK and AAB (R8 on)
        if: steps.signing.outputs.production_signed == 'true'
        env:
          SALI_KEYSTORE_BASE64: ${{ secrets.SALI_KEYSTORE_BASE64 }}
          SALI_KEYSTORE_PASSWORD: ${{ secrets.SALI_KEYSTORE_PASSWORD }}
          SALI_KEY_ALIAS: ${{ secrets.SALI_KEY_ALIAS }}
          SALI_KEY_PASSWORD: ${{ secrets.SALI_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          trap 'rm -f sali.keystore' EXIT
          printf '%s' "$SALI_KEYSTORE_BASE64" | base64 --decode > sali.keystore
          test -s sali.keystore
          ./gradlew --no-daemon assembleRelease bundleRelease --stacktrace \
            -Pandroid.injected.signing.store.file="$PWD/sali.keystore" \
            -Pandroid.injected.signing.store.password="$SALI_KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$SALI_KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$SALI_KEY_PASSWORD" 2>&1 | tee release.log

      - name: Build unsigned release APK and AAB (CI validation only)
        if: steps.signing.outputs.production_signed != 'true'
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon assembleRelease bundleRelease --stacktrace 2>&1 | tee release.log

      - name: Collect build artifacts without mislabeling unsigned outputs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/SaliBussiness-debug.apk

          if [[ "${{ steps.signing.outputs.production_signed }}" == "true" ]]; then
            apk_file="$(find app/build/outputs/apk/release -maxdepth 2 -type f -name '*.apk' ! -name '*unsigned*' -print -quit)"
            [[ -n "$apk_file" ]] || { echo "Signed release APK was not produced"; find app/build/outputs/apk/release -type f -print; exit 1; }

            apksigner="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
            [[ -x "$apksigner" ]] || { echo "apksigner not found"; exit 1; }
            "$apksigner" verify --verbose "$apk_file"

            cp "$apk_file" dist/SaliBussiness.apk
            bundle_file="$(find app/build/outputs/bundle/release -maxdepth 1 -type f -name '*.aab' -print -quit)"
            [[ -n "$bundle_file" ]] || { echo "Signed AAB was not produced"; exit 1; }
            cp "$bundle_file" dist/SaliBussiness.aab
          else
            release_apk="$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' -print -quit)"
            release_aab="$(find app/build/outputs/bundle/release -maxdepth 1 -type f -name '*.aab' -print -quit)"
            [[ -n "$release_apk" ]] || { echo "Unsigned release APK was not produced"; exit 1; }
            [[ -n "$release_aab" ]] || { echo "Unsigned AAB was not produced"; exit 1; }
            cp "$release_apk" dist/SaliBussiness-unsigned-release.apk
            cp "$release_aab" dist/SaliBussiness-unsigned-release.aab
          fi

          if [[ "${{ steps.signing.outputs.production_signed }}" == "true" ]]; then
            (cd dist && sha256sum SaliBussiness.apk SaliBussiness.aab > SHA256SUMS.txt)
          else
            (cd dist && sha256sum SaliBussiness-unsigned-release.apk SaliBussiness-unsigned-release.aab > SHA256SUMS.txt)
          fi
          ls -lh dist/

      - name: Upload compiler / test diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: build-logs
          path: |
            checks.log
            build.log
            release.log
            app/build/reports/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v7
        with:
          name: SaliBussiness-APK
          path: dist/*
          if-no-files-found: error
          retention-days: 60


  # Publishing is isolated from pull-request code and is the only job with write access.
  publish-release:
    name: Publish versioned GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download validated signed artifacts
        uses: actions/download-artifact@v7
        with:
          name: SaliBussiness-APK
          path: dist

      - name: Verify signed release payload and checksums
        shell: bash
        run: |
          set -euo pipefail
          test -s dist/SaliBussiness.apk
          test -s dist/SaliBussiness.aab
          test -s dist/SHA256SUMS.txt
          (cd dist && sha256sum --check SHA256SUMS.txt)

      - name: Publish versioned GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: SaliBussiness ${{ github.ref_name }}
          generate_release_notes: true
          make_latest: true
          files: |
            dist/SaliBussiness.apk
            dist/SaliBussiness.aab
            dist/SHA256SUMS.txt
