name: Build SaliBussiness APK

on:
  workflow_dispatch:
  push:
    branches: [ main, 'arena/**' ]

permissions:
  contents: write

concurrency:
  group: build-sali-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Generate Gradle wrapper (no binary jar committed)
        run: gradle wrapper --gradle-version 8.9

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK (installable, no secrets required)
        run: |
          set -o pipefail
          ./gradlew assembleDebug --stacktrace 2>&1 | tee build.log

      - name: Build signed release APK (only when signing secrets exist)
        env:
          SALI_KEYSTORE_BASE64: ${{ secrets.SALI_KEYSTORE_BASE64 }}
          SALI_KEYSTORE_PASSWORD: ${{ secrets.SALI_KEYSTORE_PASSWORD }}
          SALI_KEY_ALIAS: ${{ secrets.SALI_KEY_ALIAS }}
          SALI_KEY_PASSWORD: ${{ secrets.SALI_KEY_PASSWORD }}
        run: |
          if [ -n "$SALI_KEYSTORE_BASE64" ]; then
            echo "$SALI_KEYSTORE_BASE64" | base64 -d > sali.keystore
            set -o pipefail
            ./gradlew assembleRelease --stacktrace \
              -Pandroid.injected.signing.storeFile="$PWD/sali.keystore" \
              -Pandroid.injected.signing.storePassword="$SALI_KEYSTORE_PASSWORD" \
              -Pandroid.injected.signing.keyAlias="$SALI_KEY_ALIAS" \
              -Pandroid.injected.signing.keyPassword="$SALI_KEY_PASSWORD" 2>&1 | tee release.log
            cp app/build/outputs/apk/release/app-release.apk SaliBussiness.apk
          else
            echo "No signing secrets configured - the debug APK below is installable as-is."
          fi

      - name: Collect installable artifacts
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk SaliBussiness-debug.apk
          if [ ! -f SaliBussiness.apk ]; then
            cp SaliBussiness-debug.apk SaliBussiness.apk
          fi
          ls -lh *.apk

      - name: Upload compiler log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            build.log
            release.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SaliBussiness-APK
          path: |
            SaliBussiness.apk
            SaliBussiness-debug.apk
          if-no-files-found: error
          retention-days: 60

      - name: Create/update GitHub Release (main only)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: SaliBussiness (latest build)
          body: |
            Automatic build. `SaliBussiness.apk` is installable (signed release when signing
            secrets are configured, otherwise the debug build). Only the two 2-page trial PDFs
            are ever attached to an email; every PDF in a domain folder is read by the AI.
          files: |
            SaliBussiness.apk
            SaliBussiness-debug.apk
          make_latest: true
