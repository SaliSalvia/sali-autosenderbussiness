name: Build SaliBussiness APK

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-sali
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 8.9

      - name: Build debug APK (installable fallback)
        run: ./gradlew assembleDebug

      - name: Build release APK (signed if secrets configured)
        env:
          SALI_KEYSTORE_BASE64: ${{ secrets.SALI_KEYSTORE_BASE64 }}
          SALI_KEYSTORE_PASSWORD: ${{ secrets.SALI_KEYSTORE_PASSWORD }}
          SALI_KEY_ALIAS: ${{ secrets.SALI_KEY_ALIAS }}
          SALI_KEY_PASSWORD: ${{ secrets.SALI_KEY_PASSWORD }}
        run: |
          if [ -n "$SALI_KEYSTORE_BASE64" ]; then
            echo "$SALI_KEYSTORE_BASE64" | base64 -d > sali.keystore
            ./gradlew assembleRelease \
              -Pandroid.injected.signing.storeFile="$PWD/sali.keystore" \
              -Pandroid.injected.signing.storePassword="$SALI_KEYSTORE_PASSWORD" \
              -Pandroid.injected.signing.keyAlias="$SALI_KEY_ALIAS" \
              -Pandroid.injected.signing.keyPassword="$SALI_KEY_PASSWORD"
            cp app/build/outputs/apk/release/app-release.apk SaliBussiness.apk
          else
            echo "No signing secrets - building unsigned release only"
            ./gradlew assembleRelease || true
            [ -f app/build/outputs/apk/release/app-release-unsigned.apk ] && cp app/build/outputs/apk/release/app-release-unsigned.apk SaliBussiness-unsigned.apk || true
          fi

      - name: Collect artifacts
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk SaliBussiness-debug.apk
          ls -lh *.apk || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SaliBussiness-APK
          path: |
            SaliBussiness.apk
            SaliBussiness-debug.apk
          if-no-files-found: error
          retention-days: 60

      - name: Create/update release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: SaliBussiness (latest build)
          files: |
            SaliBussiness.apk
            SaliBussiness-debug.apk
          make_latest: true
